# Builds the debug APK on GitHub's servers (they have the Android SDK), runs the engine tests,
# and on the main branch publishes the APK to a "latest" release you can download on the tablet.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine and build debug APK
        run: |
          chmod +x gradlew   # uploads from a phone or the web can drop the executable bit
          ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AutoFlow-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AutoFlow-debug.apk --prerelease \
            --title "AutoFlow (latest debug build)" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Open this page on the tablet and tap AutoFlow-debug.apk to install."
